<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #f4f6fb;
    font-family: "Nirmala UI", "Noto Sans Telugu", "Noto Sans", sans-serif; }
  .top { height: 330px; background: linear-gradient(135deg, #0d3b66, #1e6091 60%, #168aad); color: #fff; padding: 46px 56px 0; position: relative; overflow: hidden; }
  .top::after { content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .label { display: inline-block; background: #ffd166; color: #0d3b66; font-size: 32px; font-weight: 900; padding: 10px 26px; border-radius: 40px; }
  .org { margin-top: 26px; font-size: 50px; font-weight: 800; line-height: 1.25; max-width: 720px; }
  .count { position: absolute; right: 56px; top: 150px; z-index: 2; width: 250px; height: 250px; border-radius: 50%; background: #ef476f; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(239,71,111,.4); border: 8px solid #fff; }
  .count b { font-size: 70px; line-height: 1; } .count span { font-size: 30px; font-weight: 700; margin-top: 6px; }
  .rows { padding: 70px 56px 0; }
  .row { display: flex; gap: 22px; align-items: flex-start; background: #fff; border-radius: 26px; padding: 26px 30px; margin-bottom: 22px;
    box-shadow: 0 6px 18px rgba(13,59,102,.08); max-width: 700px; }
  .row:nth-child(n+2) { max-width: none; }
  .ic { flex: none; width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 38px; background: #e7f0fb; }
  .k { font-size: 26px; color: #6b7a90; font-weight: 700; }
  .v { font-size: 36px; color: #14213d; font-weight: 800; line-height: 1.3; }
  .date .ic { background: #fde2e8; } .date .v { color: #d00042; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #0d3b66; color: #fff; display: flex; align-items: center;
    justify-content: center; font-size: 29px; font-weight: 700; padding: 0 30px; text-align: center; }
  .hide { display: none; }
</style>
</head>
<body>
  <div class="top">
    <div class="label">📢 ఉద్యోగ సమాచారం</div>
    <div class="org" id="org"></div>
  </div>
  <div class="count"><b id="posts"></b><span>పోస్టులు</span></div>
  <div class="rows">
    <div class="row"><div class="ic">💼</div><div><div class="k">పోస్టు</div><div class="v" id="post"></div></div></div>
    <div class="row"><div class="ic">🎓</div><div><div class="k">అర్హత</div><div class="v" id="qual"></div></div></div>
    <div class="row" id="agerow"><div class="ic">🎂</div><div><div class="k">వయసు</div><div class="v" id="age"></div></div></div>
    <div class="row date"><div class="ic">⏰</div><div><div class="k">దరఖాస్తు చివరి తేదీ</div><div class="v" id="date"></div></div></div>
    <div class="row"><div class="ic">🌐</div><div><div class="k">అధికారిక వెబ్‌సైట్</div><div class="v" id="site"></div></div></div>
  </div>
  <div class="foot">✅ ఎవరికీ డబ్బులు కట్టకండి • అధికారిక website లోనే apply చేయండి</div>
<script>
  window.fill = (j) => {
    for (const k of ['org', 'posts', 'post', 'qual', 'date', 'site', 'age']) document.getElementById(k).textContent = j[k] || '';
    if (!j.age) document.getElementById('agerow').classList.add('hide');
    const org = document.getElementById('org'); if (j.org.length > 30) org.style.fontSize = '42px';
    if (String(j.posts).length > 4) document.querySelector('.count b').style.fontSize = '56px';
  };
</script>
</body>
</html>
