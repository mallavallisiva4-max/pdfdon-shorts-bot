name: Upload Custom Video

# Uploads a video you made yourself to YouTube (public) and Instagram.
# Put short.mp4 + script.json (+ thumb.png) in custom/<name>/, then run this with folder = custom/<name>
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder with short.mp4 and script.json, e.g. custom/lion-story"
        type: string
        required: true

permissions:
  contents: write   # temporary GitHub Release that Instagram downloads the video from

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python -m bot.custom "${{ inputs.folder }}"
