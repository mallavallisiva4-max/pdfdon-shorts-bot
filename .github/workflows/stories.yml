name: Lion Stories

# "సింహం నాన్న కథలు" - animated animal stories, on the channel's old schedule (10:00 AM India time).
on:
  schedule:
    # 9:37 AM India time: GitHub often starts scheduled runs late (and skips busy :00/:30 slots),
    # so this asks a bit early on a quiet minute and the video lands around 10 AM.
    - cron: "7 4 * * 1,3,5"    # Mon, Wed, Fri: story Short
    - cron: "7 4 * * 2,4"      # Tue, Thu: long video (3 stories joined)
  workflow_dispatch:
    inputs:
      kind:
        description: "Video type"
        type: choice
        options: [short, long]
        default: short
      dry_run:
        description: "Test only - make the video, do not upload"
        type: boolean
        default: true
      episode:
        description: "Episode id from stories/episodes.json (empty = next one)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Skip if today's story is already up
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$(git log --since='12 hours ago' --grep='Story uploaded' --format=%h)" ]; then
            echo "A story was already uploaded in the last 12 hours - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Telugu fonts
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Install Python packages and browser
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Make and upload the story
        id: run
        if: steps.check.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ github.event_name == 'schedule' && (github.event.schedule == '7 4 * * 2,4' && 'long' || 'short') || inputs.kind }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m bot.story --kind "$KIND" --dry-run --id "$EPISODE"
          else
            python -m bot.story --kind "$KIND" --id "$EPISODE"
          fi

      - name: Keep the video for 14 days
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: story
          path: |
            out_story/short.mp4
            out_story/long.mp4
            out_story/thumb.png
            out_story/script.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Remember the episode
        if: steps.run.outputs.saved == 'true'
        run: |
          git config user.name "pdfdon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/stories_done.json state/stories_long_done.json
          git commit -m "Story uploaded: ${{ steps.run.outputs.video_id }}"
          git pull --rebase -q
          git push
